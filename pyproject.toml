[tool.poetry]
name = "batter"
version = "1.0"
description = "Better version of BAT"
authors = ["Sybren A. Stüvel <sybren@blender.org>"]
license = "GPL-3.0-or-later"

[tool.poetry.dependencies]
python = "==3.13.*"

[tool.poetry.group.dev.dependencies]
mypy = "^1.19.1"
ruff = "^0.15.0"
# bpy = { version = "5.1.0", source = "michaelgold" }

[[tool.poetry.source]]
name = "michaelgold"
url = "https://michaelgold.github.io/buildbpy/"
priority = "supplemental"

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"

[tool.mypy]
# Prevent error message that bpy is untyped (most of its code is, indeed, untyped).
disable_error_code = "import-untyped"
files = ["."]
# Ignore files in directories with ___ in their name. This is just a way to hide
# things from mypy.
exclude = "___|^docs/"
strict = true

[[tool.mypy.overrides]]
# Mypy doesn't like our use of mypy.api for some reason.
module = "run_mypy"
ignore_errors = true

[tool.ruff]
line-length = 88
target-version = "py313"

# Enable Pyflakes (`F`) and a subset of the pycodestyle (`E`) codes by default.
# Unlike Flake8, Ruff doesn't enable pycodestyle warnings (`W`) or
# McCabe complexity (`C901`) by default.
lint.select = ["E4", "E7", "E9", "F", "W", "C901"]
lint.ignore = [
# Import not at top of file. Batter needs to add to sys.path before importing.
"E402"
]

# Allow fix for all enabled rules (when `--fix`) is provided.
lint.fixable = ["ALL"]
lint.unfixable = []
